services:
  - type: web
    name: kisanslot-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: AVERAGE_PROCESSING_TIME_MINUTES
        value: "6"

  - type: static
    name: kisanslot-admin
    rootDir: admin_dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://kisanslot-backend.onrender.com/api"
      - key: VITE_WS_URL
        value: "wss://kisanslot-backend.onrender.com/ws"
