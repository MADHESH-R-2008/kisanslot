name: kisanslot
description: "Smart Farmer Procurement & Queue Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/kisanslot_app_icon.png
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: assets/icons/kisanslot_app_icon.png
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
